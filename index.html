<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SJ/Engineer</title>
<meta content="Suhail Jameel — Computer Engineering student at Trinity College Dublin. Software, embedded systems, and everything in between." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080808;
  --bg-soft:#0e0e0e;
  --panel:#101010;
  --line:#1e1e1e;
  --text:#e8e6e3;
  --text-dim:#8a8782;
  --text-faint:#55534f;
  --accent:#0569b9;
  --accent-soft:rgba(5,105,185,.12);
  --topbar-h:60px;
}
[data-theme="light"]{
  --bg:#f4f3f0;
  --bg-soft:#ecebe7;
  --panel:#ffffff;
  --line:#dcdad4;
  --text:#171615;
  --text-dim:#5d5b56;
  --text-faint:#9b9890;
  --accent:#0052a3;
  --accent-soft:rgba(0,82,163,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',ui-monospace,monospace;
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}

/* ---------- topbar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--topbar-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:500;letter-spacing:.12em;font-size:14px}
.brand b{color:var(--accent)}
.nav{display:flex;gap:26px}
.nav a{
  font-size:13.5px;letter-spacing:.06em;color:var(--text-dim);
  position:relative;padding:4px 0;transition:color .2s;
}
.nav a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--accent);transition:width .25s ease;
}
.nav a:hover,.nav a.active{color:var(--text)}
.nav a.active::after{width:100%}
.topbar-right{display:flex;align-items:center;gap:14px}
.icon-btn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:4px;color:var(--text-dim);
  background:transparent;cursor:pointer;transition:all .2s;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:15px;height:15px;fill:currentColor}
.icon-btn:focus-visible,.nav a:focus-visible,a:focus-visible,button:focus-visible{
  outline:1.5px solid var(--accent);outline-offset:2px;
}
.menu-toggle{display:none}

/* ---------- shared section frame ---------- */
section{
  min-height:100vh;
  padding:calc(var(--topbar-h) + 72px) 48px 96px;
  max-width:1200px;margin:0 auto;
}
.sec-label{
  display:flex;align-items:center;gap:12px;
  font-size:13px;letter-spacing:.16em;color:var(--text-faint);
  text-transform:uppercase;margin-bottom:40px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-label b{color:var(--accent);font-weight:400}

/* ---------- hero ---------- */
#home{display:flex;flex-direction:column;justify-content:center}
.hero{display:flex;gap:56px;align-items:center;flex-wrap:wrap}
.hero-info{flex:1;min-width:300px}
.hero h1{
  font-size:clamp(42px,6vw,72px);
  font-weight:500;line-height:1.08;letter-spacing:-.02em;margin-bottom:24px;
}
.hero .sub{color:var(--text-dim);max-width:520px;margin-bottom:30px}
.hero .sub em{font-style:normal;color:var(--text)}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;font-size:14px;letter-spacing:.06em;
  border:1px solid var(--line);border-radius:4px;
  color:var(--text);transition:all .2s;cursor:pointer;background:transparent;
  font-family:inherit;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:transparent;color:var(--accent)}
.hero-right{
  display:flex;flex-direction:column;gap:16px;
  flex-shrink:0;
}
.hero-photo{
  width:280px;
  border:1px solid var(--line);border-radius:6px;overflow:hidden;
  position:relative;background:var(--panel);
}
.hero-photo img{width:100%;height:auto;display:block;}
.hero-edu{
  width:280px;
  border:1px solid var(--line);border-radius:6px;
  background:var(--panel);padding:16px 18px;
}
.hero-edu-name{
  font-size:14px;font-weight:500;color:var(--text);
  margin-bottom:5px;
}
.hero-edu-sub{
  font-size:12.5px;color:var(--text-dim);line-height:1.5;
}
.hero-eyebrow{
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:18px;
}
.accent-word{color:var(--accent);}
.cursor{display:inline-block;width:.6em;background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}



/* ---------- projects ---------- */
.project{
  display:grid;grid-template-columns:1fr 1fr;gap:64px;
  align-items:center;padding:64px 0;border-top:1px solid var(--line);
}
.project:first-of-type{border-top:none;padding-top:0}
.project:nth-child(even) .proj-media{order:2}
.proj-media{
  border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:var(--panel);position:relative;cursor:pointer;
}
.proj-media img{width:100%;height:320px;object-fit:contain;background:var(--panel);transition:transform .35s ease}
.proj-media:hover img{transform:scale(1.025)}
.proj-media .play-tag{
  position:absolute;top:12px;right:12px;
  font-size:11px;letter-spacing:.12em;padding:5px 10px;border-radius:3px;
  background:var(--accent);color:#fff;
}
.proj-media.no-video{cursor:default}
.proj-placeholder{
  width:100%;height:320px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:28px;background:linear-gradient(145deg,var(--panel),var(--bg-soft));
  border-bottom:1px solid var(--line);
}
.proj-placeholder .ph-kicker{font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.proj-placeholder .ph-title{font-size:clamp(24px,3vw,38px);line-height:1.08;font-weight:500;letter-spacing:-.03em;color:var(--text)}
.proj-placeholder .ph-stack{font-size:12px;color:var(--text-faint);margin-top:12px;line-height:1.5}
.proj-info .proj-index{font-size:13px;color:var(--text-faint);letter-spacing:.14em;margin-bottom:12px}
.proj-info h3{font-size:26px;font-weight:500;margin-bottom:8px}
.proj-info .proj-dates{font-size:13px;color:var(--text-faint);margin-bottom:18px}
.proj-info p{font-size:15px;color:var(--text-dim);margin-bottom:20px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tag{
  font-size:13px;padding:5px 12px;border-radius:3px;
  border:1px solid var(--line);color:var(--text-dim);background:var(--bg-soft);
}
.proj-links{display:flex;gap:18px;font-size:12.5px}
.proj-links a,.proj-links button{
  color:var(--accent);letter-spacing:.06em;background:none;border:none;
  font-family:inherit;font-size:inherit;cursor:pointer;padding:0;
}
.proj-links a:hover,.proj-links button:hover{text-decoration:underline}

/* ---------- experience ---------- */
.xp{border-left:1px solid var(--line);margin-left:6px;padding-left:32px;position:relative}
.xp-item{position:relative;padding-bottom:48px}
.xp-item:last-child{padding-bottom:0}
.xp-item::before{
  content:"";position:absolute;left:-37px;top:6px;
  width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--accent);
}
.xp-item .xp-dates{font-size:12px;color:var(--text-faint);letter-spacing:.1em;margin-bottom:6px}
.xp-item h3{font-size:20px;font-weight:500}
.xp-item .xp-org{font-size:15px;color:var(--accent);margin-bottom:16px}
.xp-item ul{list-style:none;font-size:15px;color:var(--text-dim)}
.xp-item li{padding:4px 0 4px 18px;position:relative}
.xp-item li::before{content:"\2013";position:absolute;left:0;color:var(--text-faint)}

/* ---------- skills ---------- */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.skill-group{
  border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:22px;
}
.skill-group h3{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:400;margin-bottom:14px;
}
.skill-group .tags{margin-bottom:0}

/* ---------- contact ---------- */
#contact{min-height:80vh;display:flex;flex-direction:column}
.contact-wrap{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:center}
.contact-wrap h2{font-size:clamp(28px,4.5vw,44px);font-weight:500;margin-bottom:14px}
.contact-wrap p{color:var(--text-dim);max-width:54ch;margin-bottom:30px}
.contact-list{list-style:none;font-size:16px}
.contact-list li{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap}
.contact-list li:last-child{border-bottom:1px solid var(--line)}
.contact-list .k{width:90px;color:var(--text-faint);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px}
.contact-list a{color:var(--text)}
.contact-list a:hover{color:var(--accent)}
footer{
  max-width:1200px;margin:0 auto;padding:24px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--line);
}

/* ---------- video modal ---------- */
.modal{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);padding:24px;
}
.modal.open{display:flex}
.modal-box{width:min(900px,100%);position:relative}
.modal-box iframe{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:6px;background:#000}
.modal-close{
  position:absolute;top:-42px;right:0;
  background:none;border:1px solid var(--line);border-radius:4px;
  color:#fff;font-family:inherit;font-size:12px;letter-spacing:.1em;
  padding:6px 14px;cursor:pointer;
}
.modal-close:hove
